// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    if (file("app/src/${System.getenv('HYZZ_APP_VARIANT') ?: 'customer'}/google-services.json").exists()) { classpath('com.google.gms:google-services:4.4.4') }
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"

// Expo embeds app.config.js in the APK. Invalidate it when switching audiences.
allprojects {
    tasks.configureEach { task ->
        if (task.name.toLowerCase().contains('expoconfig') || task.name.startsWith('createBundle')) {
            task.inputs.property('hyzzAppVariant', System.getenv('HYZZ_APP_VARIANT') ?: 'customer')
        }
    }
}
apply plugin: "com.facebook.react.rootproject"

// Keep Expo's generated CMake staging files outside node_modules on Windows.
subprojects { module ->
  if (module.name == 'expo-modules-core') {
    module.plugins.withId('com.android.library') {
      module.android.externalNativeBuild.cmake.buildStagingDirectory =
        new File(rootProject.projectDir, '.cxx/expo-modules-core')
    }
  }
}
