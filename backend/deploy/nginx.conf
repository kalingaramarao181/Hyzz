# Replace TLS certificate paths if Certbot uses different names.
limit_req_zone $binary_remote_addr zone=hyzz_api:10m rate=10r/s;
server {
 listen 80;
 server_name api.srtechcreators.in;
 location /.well-known/acme-challenge/ { root /var/www/html; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 server_name api.srtechcreators.in;
 ssl_certificate /etc/letsencrypt/live/api.srtechcreators.in/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/api.srtechcreators.in/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 6m;
 client_body_timeout 20s;
 add_header Strict-Transport-Security "max-age=31536000" always;
 location / {
  limit_req zone=hyzz_api burst=30 nodelay;
  proxy_pass http://127.0.0.1:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  # Overwrite, rather than trust a client-supplied forwarding chain.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
 }
}
