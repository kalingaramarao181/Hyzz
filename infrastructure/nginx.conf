server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.srtechcreators.in; img-src 'self' data: blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
 location / { try_files $uri $uri/ /index.html; }
}
